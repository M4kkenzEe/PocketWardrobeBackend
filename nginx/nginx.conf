events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS. Lets nginx re-resolve container IPs at runtime
    # so a backend restart (new container IP) doesn't strand nginx on a stale
    # address and cause 502s. valid=10s caps how long a resolution is cached.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Allow photo uploads. nginx default is 1MB, which 413s real phone photos
    # before they reach the backend (backend itself allows up to MAX_FILE_SIZE_MB).
    client_max_body_size 25m;

    server {
        listen 80;
        server_name clothis.tech www.clothis.tech api.clothis.tech;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name clothis.tech www.clothis.tech;

        ssl_certificate /etc/letsencrypt/live/clothis.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clothis.tech/privkey.pem;

        # Serve static landing page from /usr/share/nginx/html
        # (bind-mounted from /opt/clothis-landing on the host)
        root /usr/share/nginx/html;
        index index.html;

        # Android App Links verification
        location /.well-known/ {
            alias /etc/nginx/well-known/;
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
        }

        # Static assets (Astro builds to _astro/) — long cache
        location /_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Everything else → index.html (SPA fallback)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 443 ssl;
        server_name api.clothis.tech;

        ssl_certificate /etc/letsencrypt/live/clothis.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clothis.tech/privkey.pem;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            # Variable in proxy_pass forces runtime DNS resolution via resolver.
            set $backend "backend:8080";
            proxy_pass http://$backend;
        }
    }
}
