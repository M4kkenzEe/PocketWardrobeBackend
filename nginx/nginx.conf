events {}

http {
    server {
        listen 80;
        server_name clothis.tech www.clothis.tech api.clothis.tech;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name clothis.tech www.clothis.tech;

        ssl_certificate /etc/letsencrypt/live/clothis.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clothis.tech/privkey.pem;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://backend:8080;
        }
    }

    server {
        listen 443 ssl;
        server_name api.clothis.tech;

        ssl_certificate /etc/letsencrypt/live/clothis.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clothis.tech/privkey.pem;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://backend:8080;
        }
    }
}
