version: '3.8'

services:
  # ==================================================================================
  # PostgreSQL Database
  # ==================================================================================
  postgres:
    image: postgres:16-alpine
    container_name: pocketwardrobe_db
    environment:
      POSTGRES_DB: ${DB_NAME:-wardrobe}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres1}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - pocketwardrobe_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wardrobe}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==================================================================================
  # PocketWardrobe Backend Application
  # ==================================================================================
  backend:
    #    build:
    #      context: .
    #      dockerfile: Dockerfile
    image: yura91191/pocketwardrobe-backend:latest
    container_name: pocketwardrobe_backend
    env_file: .env
    environment:
      # Docker networking overrides
      DB_URL: jdbc:postgresql://postgres:5432
      SERVER_HOST: api.clothis.tech
      SERVER_SCHEME: https
      SERVER_PORT: 443
      # External services (Mac/Windows use host.docker.internal)
      REMOVE_BG_SERVICE_URL: http://removebg:8000/
      ANALYSIS_SERVICE_URL: http://ai-analyzer:8088/
      RECOMMENDATION_SERVICE_URL: http://recommendation:8001/
    ports:
      # Bind to loopback only — nginx reaches the backend via the internal Docker network (backend:8080).
      # Publishing publicly would let attackers bypass nginx and spoof X-Forwarded-For.
      - "127.0.0.1:8080:8080"
    volumes:
      # Bind mounts for persistent user data
      - ./uploads:/app/uploads
      - ./looks:/app/looks
    networks:
      - pocketwardrobe_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  removebg:
    image: yura91191/removebg-service:amd64
    container_name: removebg-service
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - pocketwardrobe_network
    healthcheck:
      # These python images have no curl — use python3 + urllib instead.
      test: [ "CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json',timeout=5).status==200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai-analyzer:
    image: yura91191/fashion-analyzer:latest
    container_name: fashion-analyzer
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - ANALYZER_MODEL_ID=patrickjohncyh/fashion-clip
      - ANALYZER_PROMPTS=catalog
    networks:
      - pocketwardrobe_network
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8088
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8088/health',timeout=10).status==200 else 1)" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  # ==================================================================================
  # Recommendation AI Service
  # ==================================================================================
  recommendation:
    image: yura91191/recommendation-service:amd64
    container_name: recommendation-service
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-wardrobe}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres1}
      - UPLOADS_DIR=/app/uploads
      - BACKEND_HOST=api.clothis.tech
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8001:8001"
    networks:
      - pocketwardrobe_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=5).status==200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:stable-alpine
    container_name: wardrobe-nginx
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/well-known:/etc/nginx/well-known:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/clothis-landing:/usr/share/nginx/html:ro
    networks:
      - pocketwardrobe_network
    depends_on:
      - backend



# ====================================================================================
# Volumes
# ====================================================================================
volumes:
  postgres_data:
    driver: local

  huggingface-cache:

# ====================================================================================
# Networks
# ====================================================================================
networks:
  pocketwardrobe_network:
    driver: bridge
